services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: here
      POSTGRES_PASSWORD: here
      POSTGRES_DB: here
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data:
