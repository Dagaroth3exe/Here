services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: here
      POSTGRES_PASSWORD: here
      POSTGRES_DB: here
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data

  # Open-source metasearch for Ask HERE's AI answers. It queries external
  # engines and forums (a deliberate, scoped exception to the open-source
  # rule); the instance itself is self-hosted.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-to-a-long-random-string}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Self-hosted push (UnifiedPush) for chat and Ask HERE notifications —
  # open source, so no Google/Firebase dependency. Phones need a
  # UnifiedPush distributor app (e.g. ntfy) pointed at this server.
  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://10.0.2.2:8090}
      NTFY_BEHIND_PROXY: 'false'
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    ports:
      - '8090:80'
    volumes:
      - ntfy_cache:/var/cache/ntfy

volumes:
  ntfy_cache:
  postgres_data:
  valkey_data:
